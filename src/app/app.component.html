@if (auth.usuarioActual(); as usuario) {
<div class="layout">
  <aside class="sidebar">
    <div class="logo">🌶️ {{ nombre }}</div>
    <nav>
      @for (item of menu; track item.ruta) {
        <a [routerLink]="item.ruta" routerLinkActive="activo">
          <span>{{ item.icono }}</span> {{ item.texto }}
        </a>
      }
    </nav>
    <small class="pie">Dashboard de Restaurante · S13 AP7</small>
  </aside>

  <div class="contenido">
    <header class="encabezado">
      <h1>Panel de Gestión · {{ nombre }}</h1>
      <div class="acciones">
        <span class="usuario">👤 {{ usuario.nombre }}</span>
        <button type="button" class="logout" (click)="cerrarSesion()">🚪 Cerrar sesión</button>
      </div>
    </header>
    <main class="principal">
      <router-outlet />
    </main>
  </div>
</div>
} @else {
  <router-outlet />
}
